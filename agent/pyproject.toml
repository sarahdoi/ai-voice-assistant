[project]
name = "sarjy"
version = "0.1.0"
description = "Voice assistant agent with persistent memory"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[google]~=1.8",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "asyncpg>=0.29",
]

[project.scripts]
voice-agent = "sarjy.agent:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sarjy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
